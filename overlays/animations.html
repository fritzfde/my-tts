<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .animation-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        canvas.animation {
            position: relative; /* Changed from absolute */
            max-width: 90%;
            max-height: 90%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        canvas.animation.playing {
            opacity: 1;
        }

        /* Debug overlay */
        .debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            font-family: monospace;
            display: none;
        }

        .debug-info.visible {
            display: block;
        }
    </style>
</head>
<body>
<div class="animation-container" id="animationContainer"></div>

<div class="debug-info" id="debugInfo">
    <div>Animations Enabled: <span id="debugEnabled">false</span></div>
    <div>Green Threshold: <span id="debugThreshold">100</span></div>
    <div>Tolerance: <span id="debugTolerance">50</span></div>
    <div>Playing: <span id="debugPlaying">none</span></div>
    <div>Cooldown Queue: <span id="debugQueue">0</span></div>
    <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.2);">
        SSE: <span id="debugSSE" style="color: #ff6b6b;">disconnected</span>
    </div>
    <div>Mappings: <span id="debugMappings">0</span></div>
</div>

<script>
    // ── Audio Autoplay Unlock (AGGRESSIVE) ─────────────────────────

    let audioUnlocked = false;

    function unlockAudio() {
        if (audioUnlocked) return;

        const silentAudio = new Audio();
        silentAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
        silentAudio.volume = 0.01;

        silentAudio.play().then(() => {
            audioUnlocked = true;
            console.log('✓ Audio autoplay unlocked');
        }).catch(() => {
            console.log('⏳ Click page to unlock audio...');
        });
    }

    // IMMEDIATE unlock attempts
    unlockAudio();
    setTimeout(unlockAudio, 100);
    setTimeout(unlockAudio, 500);
    setTimeout(unlockAudio, 1000);
    setTimeout(unlockAudio, 2000);

    // Unlock on any interaction
    document.addEventListener('click', unlockAudio);
    document.addEventListener('keydown', unlockAudio);
    document.addEventListener('touchstart', unlockAudio);

    // Show big "Click to Enable" overlay if not unlocked after 3 seconds
    setTimeout(() => {
        if (!audioUnlocked) {
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0,0,0,0.8);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 99999;
                cursor: pointer;
                font-family: Arial, sans-serif;
            `;
            overlay.innerHTML = `
                <div style="text-align: center; color: white;">
                    <div style="font-size: 48px; margin-bottom: 20px;">🔊</div>
                    <div style="font-size: 24px; margin-bottom: 10px;">Click Anywhere to Enable Audio</div>
                    <div style="font-size: 14px; color: rgba(255,255,255,0.7);">Browser requires user interaction</div>
                </div>
            `;
            overlay.addEventListener('click', () => {
                unlockAudio();
                overlay.remove();
            });
            document.body.appendChild(overlay);
        }
    }, 3000);

    // ── Configuration (sync with UI settings) ──────────────────────

    let animationsEnabled = true;
    let animationMappings = {}; // trigger → filename
    let chromaKeySettings = {
        greenThreshold: 100,  // How green is "green enough"
        tolerance: 50,        // Tolerance for non-pure greens
        spillReduction: 0.5   // Remove green spill on edges
    };

    // ── State Management ────────────────────────────────────────────

    const playingAnimations = new Set();
    const recentlyPlayed = new Map();
    const COOLDOWN_MS = 5000; // 5 second cooldown per animation type

    // ── Load Settings from localStorage OR URL Parameters ─────────

    function loadSettings() {
        // Check if we have URL parameters (for OBS)
        const params = new URLSearchParams(window.location.search);

        if (params.size > 0) {
            // Load from URL parameters (OBS mode)
            console.log('📡 Loading settings from URL parameters...');

            // Animation enabled
            animationsEnabled = params.get('enabled') !== 'false'; // Default true

            // Parse mappings from URL
            // Format: ?lol=file1.MOV&wow=file2.MOV
            animationMappings = {};
            const reservedParams = ['enabled', 'threshold', 'tolerance', 'position'];

            for (const [key, value] of params.entries()) {
                if (!reservedParams.includes(key)) {
                    animationMappings[key.toLowerCase()] = value;
                }
            }

            // Chroma key settings
            chromaKeySettings = {
                greenThreshold: parseInt(params.get('threshold') || '70'),
                tolerance: parseInt(params.get('tolerance') || '60'),
                spillReduction: 0.5
            };

            // Position (new!)
            const position = params.get('position') || 'bottom-left';
            setAnimationPosition(position);

            console.log('✅ Settings loaded from URL:', {
                enabled: animationsEnabled,
                mappings: Object.keys(animationMappings).length,
                chroma: chromaKeySettings,
                position: position
            });
        } else {
            // Load from localStorage (browser mode)
            console.log('💾 Loading settings from localStorage...');

            try {
                const enabled = localStorage.getItem('animations_enabled');
                if (enabled !== null) {
                    animationsEnabled = enabled === 'true';
                }

                const mappings = localStorage.getItem('animation_mappings');
                if (mappings) {
                    animationMappings = JSON.parse(mappings);
                }

                const chromaSettings = localStorage.getItem('chroma_key_settings');
                if (chromaSettings) {
                    chromaKeySettings = JSON.parse(chromaSettings);
                }

                const position = localStorage.getItem('animation_position') || 'bottom-left';
                setAnimationPosition(position);

                console.log('✅ Animation settings loaded from localStorage:', {
                    enabled: animationsEnabled,
                    mappings: Object.keys(animationMappings).length,
                    chroma: chromaKeySettings,
                    position: position
                });
            } catch (e) {
                console.error('Error loading animation settings:', e);
            }
        }

        updateDebugInfo();
    }

    // ── Set Animation Position ──────────────────────────────────────

    function setAnimationPosition(position) {
        const container = document.getElementById('animationContainer');
        if (!container) return;

        // Reset all position styles
        container.style.top = '';
        container.style.bottom = '';
        container.style.left = '';
        container.style.right = '';
        container.style.transform = '';
        container.style.justifyContent = '';
        container.style.alignItems = '';

        // Apply position
        switch(position) {
            case 'top-left':
                container.style.top = '20px';
                container.style.left = '20px';
                container.style.justifyContent = 'flex-start';
                container.style.alignItems = 'flex-start';
                break;

            case 'top-center':
                container.style.top = '20px';
                container.style.left = '50%';
                container.style.transform = 'translateX(-50%)';
                container.style.justifyContent = 'center';
                container.style.alignItems = 'flex-start';
                break;

            case 'top-right':
                container.style.top = '20px';
                container.style.right = '20px';
                container.style.justifyContent = 'flex-end';
                container.style.alignItems = 'flex-start';
                break;

            case 'center-left':
                container.style.top = '50%';
                container.style.left = '20px';
                container.style.transform = 'translateY(-50%)';
                container.style.justifyContent = 'flex-start';
                container.style.alignItems = 'center';
                break;

            case 'center':
                container.style.top = '50%';
                container.style.left = '50%';
                container.style.transform = 'translate(-50%, -50%)';
                container.style.justifyContent = 'center';
                container.style.alignItems = 'center';
                break;

            case 'center-right':
                container.style.top = '50%';
                container.style.right = '20px';
                container.style.transform = 'translateY(-50%)';
                container.style.justifyContent = 'flex-end';
                container.style.alignItems = 'center';
                break;

            case 'bottom-left':
            default:
                container.style.bottom = '20px';
                container.style.left = '20px';
                container.style.justifyContent = 'flex-start';
                container.style.alignItems = 'flex-end';
                break;

            case 'bottom-center':
                container.style.bottom = '20px';
                container.style.left = '50%';
                container.style.transform = 'translateX(-50%)';
                container.style.justifyContent = 'center';
                container.style.alignItems = 'flex-end';
                break;

            case 'bottom-right':
                container.style.bottom = '20px';
                container.style.right = '20px';
                container.style.justifyContent = 'flex-end';
                container.style.alignItems = 'flex-end';
                break;
        }

        console.log(`📍 Animation position set to: ${position}`);
    }

    // ── SSE Connection ──────────────────────────────────────────────

    const eventSource = new EventSource('/overlay/animations/stream');

    eventSource.onopen = () => {
        console.log('🎬 Animation overlay connected');
        document.getElementById('debugSSE').textContent = 'connected';
        document.getElementById('debugSSE').style.color = '#00f2ea';
        updateDebugInfo();
    };

    eventSource.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            console.log('🎬 Received animation event:', data);

            if (!animationsEnabled) {
                console.log('⏸️ Animations disabled, ignoring');
                return;
            }

            handleAnimationEvent(data);
        } catch (e) {
            console.error('Error parsing animation event:', e);
        }
    };

    eventSource.onerror = (error) => {
        console.error('SSE error:', error);
        document.getElementById('debugSSE').textContent = 'error';
        document.getElementById('debugSSE').style.color = '#ff6b6b';
        updateDebugInfo();
    };

    // ── Event Handler ───────────────────────────────────────────────

    function handleAnimationEvent(data) {
        const { type, platform, trigger } = data;

        // Get animation file for this trigger
        const animationFile = animationMappings[trigger];

        if (!animationFile) {
            console.log(`No animation mapped for trigger: ${trigger}`);
            return;
        }

        playAnimation(animationFile, trigger);
    }

    // ── Animation Playback ──────────────────────────────────────────

    function playAnimation(filename, triggerName) {
        // Check cooldown
        const lastPlayed = recentlyPlayed.get(triggerName);
        if (lastPlayed && Date.now() - lastPlayed < COOLDOWN_MS) {
            console.log(`⏸️ Animation "${triggerName}" on cooldown`);
            return;
        }

        // Check if already playing
        if (playingAnimations.has(triggerName)) {
            console.log(`⏸️ Animation "${triggerName}" already playing`);
            return;
        }

        console.log(`🎬 Playing animation: ${filename} (trigger: ${triggerName})`);

        // Create video element
        const video = document.createElement('video');
        video.src = `/animations/${filename}`;
        video.muted = false;
        video.volume = 0.7;
        video.preload = 'auto';

        // Create canvas for chroma keying
        const canvas = document.createElement('canvas');
        canvas.className = 'animation';
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // Add to container
        document.getElementById('animationContainer').appendChild(canvas);

        // Mark as playing
        playingAnimations.add(triggerName);
        recentlyPlayed.set(triggerName, Date.now());
        updateDebugInfo();

        // Wait for video metadata
        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Start playback
            video.play().then(() => {
                canvas.classList.add('playing');
                processVideoFrame(video, canvas, ctx);
            }).catch(err => {
                console.error('Video play error:', err);
                console.warn('⏸️ Click page to enable autoplay');
                unlockAudio(); // Try to unlock
                cleanup();
            });
        });

        // Cleanup when done
        video.addEventListener('ended', cleanup);
        video.addEventListener('error', (e) => {
            console.error('Video error:', e);
            cleanup();
        });

        function cleanup() {
            canvas.classList.remove('playing');
            setTimeout(() => {
                canvas.remove();
                video.remove();
                playingAnimations.delete(triggerName);
                updateDebugInfo();
            }, 300);
        }
    }

    // ── Advanced Chroma Key (Green Screen Removal) ─────────────────

    function processVideoFrame(video, canvas, ctx) {
        if (video.paused || video.ended) return;

        // Draw video frame
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Get image data
        const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = frame.data;

        const { greenThreshold, tolerance, spillReduction } = chromaKeySettings;

        // Process each pixel
        for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            // Method 1: Calculate how "green" this pixel is
            const greenness = g - Math.max(r, b);

            // Method 2: Also check if green is dominant channel
            const isGreenDominant = g > r && g > b;

            // Method 3: Check green ratio (for colors like #4E9074)
            const greenRatio = g / (r + g + b + 1); // +1 to avoid division by zero

            // Combined detection: pixel is green if ANY method matches
            // Lowered from 0.38 to 0.33 to be more aggressive
            const isGreen = (greenness > greenThreshold) ||
                           (isGreenDominant && greenRatio > 0.33);

            if (isGreen) {
                // Full transparency for green pixels
                // If using ratio method, make fully transparent
                if (isGreenDominant && greenRatio > 0.33) {
                    data[i + 3] = 0; // Fully transparent
                } else {
                    // Calculate confidence for edge feathering
                    const confidence = Math.min(1, greenness / (greenThreshold + tolerance));
                    data[i + 3] = Math.floor((1 - confidence) * 255);
                }
            }
            // Remove green spill on edges
            else if (greenness > 0) {
                const spill = greenness * spillReduction;
                data[i + 1] = Math.max(0, g - spill); // Reduce green channel
            }
        }

        // Put processed frame back
        ctx.putImageData(frame, 0, 0);

        // Continue processing
        requestAnimationFrame(() => processVideoFrame(video, canvas, ctx));
    }

    // ── Debug Info ──────────────────────────────────────────────────

    function updateDebugInfo() {
        document.getElementById('debugEnabled').textContent = animationsEnabled;
        document.getElementById('debugThreshold').textContent = chromaKeySettings.greenThreshold;
        document.getElementById('debugTolerance').textContent = chromaKeySettings.tolerance;
        document.getElementById('debugPlaying').textContent = playingAnimations.size > 0
            ? Array.from(playingAnimations).join(', ')
            : 'none';
        document.getElementById('debugQueue').textContent = recentlyPlayed.size;
        document.getElementById('debugMappings').textContent = Object.keys(animationMappings).length;
    }

    // Show debug info with D key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'd' || e.key === 'D') {
            document.getElementById('debugInfo').classList.toggle('visible');
        }
    });

    // Reload settings when window gains focus (user changed settings)
    window.addEventListener('focus', loadSettings);

    // Listen for settings updates from main app
    window.addEventListener('message', (event) => {
        if (event.data.type === 'updateAnimationSettings') {
            console.log('📡 Received settings update from main app');
            loadSettings();
        }
    });

    // Initial load
    loadSettings();

    console.log('🎬 Animation overlay ready!');
    console.log('Press D to toggle debug info');
</script>
</body>
</html>
