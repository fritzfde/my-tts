<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Animation Overlay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: Arial, sans-serif;
        }
            
        #animationContainer {
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            pointer-events: none;
        }
        */

        body {
            width: 100vw;  /* Use Viewport Width */
            height: 100vh; /* Use Viewport Height */
            overflow: hidden;
            background: transparent;
            margin: 0;
        }

        /* #animationContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        } */
        #animationContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh; /* This might be slightly off on iPad */
            height: -webkit-fill-available; /* Better for iPad/iOS Safari */
            pointer-events: none;
            z-index: 10;
        }

        video.animation, canvas.animation {
            position: absolute;
            opacity: 0;
            transition: opacity 0.3s ease;
            object-fit: contain;
        }

        video.animation.active, canvas.animation.active {
            opacity: 1;
        }
        
        /* Change this to make the canvas visible immediately for testing */
        canvas.animation {
            position: absolute;
            opacity: 1; /* Force opacity to 1 to ensure it shows up */
            z-index: 10;
            pointer-events: none;
        }

        /* Keep the raw video hidden so we don't see the green background */
        video.animation {
            position: absolute;
            visibility: hidden; 
            pointer-events: none;
        }

        /* Debug Overlay */
        #debugOverlay {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border-radius: 5px;
            max-width: 300px;
            display: none;
            z-index: 9999;
            pointer-events: none;
        }

        #animationContainer {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 10;
        }

        /* Hide the raw green video */
        video.animation {
            display: none;
        }

        /* Make sure the canvas is visible and positioned correctly */
        canvas.animation {
            position: absolute;
            opacity: 0; /* Starts hidden */
            transition: opacity 0.3s ease;
            z-index: 20;
        }

        canvas.animation.active {
            opacity: 1; /* Shows up when class is added */
        }

        #debugOverlay.show { display: block; }
    </style>
</head>
<body>
<div id="animationContainer"></div>
<div id="debugOverlay">
    <div class="debug-row"><span class="debug-label">Status:</span><span class="debug-value" id="debugStatus">Loading...</span></div>
    <div class="debug-row"><span class="debug-label">Enabled:</span><span class="debug-value" id="debugEnabled">-</span></div>
    <div class="debug-row"><span class="debug-label">Mappings:</span><span class="debug-value" id="debugMappings">0</span></div>
</div>

<script>
    // Basic config
    let animationsEnabled = true;
    let animationMappings = {};
    let chromaKeySettings = { greenThreshold: 70, tolerance: 60, spillReduction: 0.5 };
    let globalPosition = 'bottom-left';
    let globalScale = 1.0;
    let animationVolume = 100;
    let totalPlayed = 0;
    let lastTrigger = 'None';

    const container = document.getElementById('animationContainer');

    // Shared AudioContext (will be created lazily)
    let audioCtx = null;
    function ensureAudioContext() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); console.log('AudioContext created'); } catch (e) { audioCtx = null; }
        }
        return audioCtx;
    }

    function updateDebugInfo() {
        const mappings = Object.keys(animationMappings).length;
        try { document.getElementById('debugMappings').textContent = mappings; } catch (e) {}
    }

    function getAnimationGain() {
        const percent = Number.isFinite(animationVolume) ? animationVolume : 100;
        return Math.max(0, Math.min(1, percent / 100));
    }

    function applyTrackedVolume(tracked) {
        if (!tracked || !tracked.video) return;
        const gain = getAnimationGain();
        tracked.video.volume = gain;
        if (tracked.gainNode) {
            tracked.gainNode.gain.value = gain;
        }
    }

    function applyVolumeToAllActiveAnimations() {
        currentAnimations.forEach(applyTrackedVolume);
    }

    function getPositionStyle(position) {
        const offset = "40px"; // Margin from the edge
        const positions = {
            'top-left':      { top: offset, left: offset, bottom: 'auto', right: 'auto', transform: 'none' },
            'top-right':     { top: offset, right: offset, bottom: 'auto', left: 'auto', transform: 'none' },
            'bottom-left':   { bottom: offset, left: offset, top: 'auto', right: 'auto', transform: 'none' },
            'bottom-right':  { bottom: offset, right: offset, top: 'auto', left: 'auto', transform: 'none' },
            'center':        { top: '50%', left: '50%', transform: 'translate(-50%, -50%)', bottom: 'auto', right: 'auto' }
        };
        return positions[position] || positions['bottom-left'];
    }

    function applyChromaKey(video, canvas) {
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let rafId = null;

        function processFrame() {
            // If video isn't actually sending data yet, skip this frame
            if (video.paused || video.ended || video.readyState < 2) {
                rafId = requestAnimationFrame(processFrame);
                return;
            }

            try {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                const threshold = Number(chromaKeySettings.greenThreshold ?? 70);
                const tolerance = Math.max(1, Number(chromaKeySettings.tolerance ?? 60));
                const spillReduction = Math.max(0, Math.min(1, Number(chromaKeySettings.spillReduction ?? 0.5)));
                const edgeStart = threshold - tolerance;
                const edgeRange = Math.max(1, threshold - edgeStart);

                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i + 1], b = data[i + 2];
                    const maxRB = Math.max(r, b);
                    const greenExcess = g - maxRB;
                    const looksGreen = g > (r * 1.03) && g > (b * 1.03);

                    if (greenExcess > edgeStart && looksGreen) {
                        // Soft key across tolerance range, with stronger falloff near threshold.
                        let keyAmount = (greenExcess - edgeStart) / edgeRange; // 0..1
                        keyAmount = Math.max(0, Math.min(1, keyAmount));
                        keyAmount = Math.pow(keyAmount, 1.35);

                        if (greenExcess >= threshold || keyAmount > 0.96) {
                            data[i + 3] = 0;
                        } else {
                            const fade = Math.pow(1 - keyAmount, 2);
                            data[i + 3] = Math.round(data[i + 3] * fade);
                        }

                        // Stronger despill on keyed pixels to remove green stroke edges.
                        const despillStrength = (0.65 + spillReduction * 0.35) * (0.35 + keyAmount * 0.65);
                        const reduction = Math.max(0, greenExcess * despillStrength);
                        g = Math.max(0, g - reduction);
                        r = Math.min(255, r + reduction * 0.18);
                        b = Math.min(255, b + reduction * 0.25);
                    } else if (greenExcess > 8 && looksGreen) {
                        // Mild cleanup even outside keyed zone for compression spill.
                        const cleanup = Math.min(1, (greenExcess - 8) / 30);
                        const reduction = greenExcess * 0.18 * cleanup;
                        g = Math.max(0, g - reduction);
                        b = Math.min(255, b + reduction * 0.2);
                    }

                    data[i] = r;
                    data[i + 1] = g;
                    data[i + 2] = b;
                }
                ctx.putImageData(imageData, 0, 0);
            } catch (e) {
                console.error("Chroma error:", e);
            }
            rafId = requestAnimationFrame(processFrame);
        }

        processFrame(); // Start immediately
        return () => { if (rafId) cancelAnimationFrame(rafId); };
    }

    // Track active animations and resources
    let currentAnimations = [];

    function stopAllAnimations() {
        currentAnimations.forEach(t => {
            try { if (t.cancelChroma) t.cancelChroma(); } catch (e) {}
            try { if (t.audioSource) t.audioSource.disconnect(); } catch (e) {}
            try { if (t.gainNode) t.gainNode.disconnect(); } catch (e) {}
            try { t.video.pause(); t.video.muted = true; t.video.currentTime = 0; } catch (e) {}
            try { t.video.removeAttribute('src'); t.video.src = ''; t.video.load(); } catch (e) {}
            try { if (t.canvas && t.canvas.parentNode) t.canvas.remove(); } catch (e) {}
            try { if (t.video && t.video.parentNode) t.video.remove(); } catch (e) {}
        });
        currentAnimations = [];
    }

    async function playAnimation(triggerName) {
        console.log('playAnimation', triggerName);
        if (!animationsEnabled) return;
        const mapping = animationMappings[triggerName] || animationMappings[triggerName.toLowerCase()];
        if (!mapping) { console.warn('No mapping for', triggerName); return; }

        stopAllAnimations();

        const filename = mapping.file || mapping;
        const position = mapping.position || globalPosition;
        const scale = mapping.scale || globalScale;
        console.log(`📏 Scaling check: Trigger=${triggerName}, Scale=${scale}`);

        lastTrigger = `${triggerName} (${new Date().toLocaleTimeString()})`;
        totalPlayed++;
        updateDebugInfo();

        const video = document.createElement('video');
        video.className = 'animation';
        video.autoplay = true;
        video.playsInline = true;
        video.setAttribute('playsinline', '');
        video.preload = 'auto';
        video.crossOrigin = 'anonymous';
        // Do not forcibly set muted here; allow audio to play when possible
        video.muted = false;
        video.src = `/animations/${filename}`;

        const canvas = document.createElement('canvas');
        canvas.className = 'animation';
        const posStyle = getPositionStyle(position);
        Object.assign(canvas.style, posStyle);
        canvas.style.transform = (posStyle.transform ? posStyle.transform + ' ' : '') + `scale(${scale})`;
        canvas.style.pointerEvents = 'none';

        container.appendChild(canvas);
        container.appendChild(video);

        const tracked = { video, canvas, cancelChroma: null, audioSource: null };
        currentAnimations.push(tracked);
        applyTrackedVolume(tracked);

        // Hook audio via AudioContext where available
        try {
            const ctx = ensureAudioContext();
            if (ctx) {
                try {
                    tracked.audioSource = ctx.createMediaElementSource(video);
                    tracked.gainNode = ctx.createGain();
                    tracked.audioSource.connect(tracked.gainNode);
                    tracked.gainNode.connect(ctx.destination);
                    tracked.gainNode.gain.value = getAnimationGain();
                    if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
                    console.log('Connected audio for', filename);
                } catch (e) { console.warn('createMediaElementSource failed', e); }
            }
        } catch (e) { console.warn('audio hookup failed', e); }

        video.addEventListener('loadedmetadata', () => {
            // Set the internal drawing resolution to match the video file
            canvas.width = video.videoWidth || 1920;
            canvas.height = video.videoHeight || 1080;

            // Use the video's natural size as the CSS basis
            canvas.style.width = video.videoWidth + 'px';
            canvas.style.height = video.videoHeight + 'px';

            try { 
                tracked.cancelChroma = applyChromaKey(video, canvas); 
            } catch (e) { 
                tracked.cancelChroma = null; 
            }
        }, { once: true });

        video.addEventListener('playing', () => {
            canvas.classList.add('active');
            
            // 1. Set internal resolution
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // 2. Set display size
            canvas.style.width = video.videoWidth + 'px';
            canvas.style.height = video.videoHeight + 'px';

            // 3. RE-APPLY POSITION AND SCALE HERE
            const posStyle = getPositionStyle(position);
            Object.assign(canvas.style, posStyle);
            
            // Combine transform and scale
            const baseTransform = posStyle.transform && posStyle.transform !== 'none' ? posStyle.transform : '';
            canvas.style.transform = `${baseTransform} scale(${scale})`.trim();
            
            // Set origin so it scales from the correct corner
            if (position.includes('left')) canvas.style.transformOrigin = 'bottom left';
            else if (position.includes('right')) canvas.style.transformOrigin = 'bottom right';
            else canvas.style.transformOrigin = 'center';

            if (tracked.cancelChroma) tracked.cancelChroma(); 
            tracked.cancelChroma = applyChromaKey(video, canvas);
        });

        video.addEventListener('ended', () => {
            canvas.classList.remove('active');
            setTimeout(() => {
                try { if (tracked.cancelChroma) tracked.cancelChroma(); } catch (e) {}
                try { if (tracked.audioSource) tracked.audioSource.disconnect(); } catch (e) {}
                try { if (tracked.gainNode) tracked.gainNode.disconnect(); } catch (e) {}
                try { video.pause(); } catch (e) {}
                try { video.removeAttribute('src'); video.src = ''; video.load(); } catch (e) {}
                if (canvas.parentNode) canvas.remove();
                if (video.parentNode) video.remove();
                const i = currentAnimations.findIndex(a => a.video === video); if (i > -1) currentAnimations.splice(i, 1);
                console.log('Finished', filename);
            }, 200);
        }, { once: true });

        video.addEventListener('error', (err) => {
            console.error('Video error', err);
            try { if (tracked.audioSource) tracked.audioSource.disconnect(); } catch (e) {}
            try { if (tracked.gainNode) tracked.gainNode.disconnect(); } catch (e) {}
            try { if (tracked.cancelChroma) tracked.cancelChroma(); } catch (e) {}
            if (canvas.parentNode) canvas.remove();
            if (video.parentNode) video.remove();
            const i = currentAnimations.findIndex(a => a.video === video); if (i > -1) currentAnimations.splice(i, 1);
        }, { once: true });

        try {
            await video.play();
            console.log('Playing', filename);
        } catch (err) {
            console.warn('play() failed, will retry', err);
            setTimeout(() => { video.play().catch(()=>{}); }, 250);
        }
    }

    // SSE connection
    function connectToAnimationStream() {
        const es = new EventSource('/overlay/animations/stream');
        es.onopen = () => console.log('Connected to animation stream');
        es.onmessage = e => {
            try {
                const d = JSON.parse(e.data);
                if (d.type === 'animation' && d.trigger) playAnimation(d.trigger);
                if (d.type === 'stop') {
                    console.log('Received stop event, stopping active animations');
                    stopAllAnimations();
                }
                if (d.type === 'config' && d.config) {
                    animationsEnabled = d.config.enabled !== false;
                    animationMappings = d.config.mappings || animationMappings;
                    chromaKeySettings = {
                        ...chromaKeySettings,
                        ...(d.config.chroma || {})
                    };
                    globalPosition = d.config.globalPosition || globalPosition;
                    globalScale = Number(d.config.globalScale) || globalScale;
                    animationVolume = d.config.animationVolume ?? animationVolume;
                    applyVolumeToAllActiveAnimations();
                    updateDebugInfo();
                    console.log('Animation config updated:', {
                        enabled: animationsEnabled,
                        chroma: chromaKeySettings,
                        position: globalPosition,
                        scale: globalScale,
                        volume: animationVolume
                    });
                }
            } catch (err) { console.error('parse', err); }
        };
        es.onerror = err => { console.error('SSE error', err); es.close(); setTimeout(connectToAnimationStream, 3000); };
    }

    // Load config and start
    (async function(){
        try {
            const params = new URLSearchParams(window.location.search);
            const cfgName = params.get('config') || 'default';
            const res = await fetch(`/api/animations/config/${cfgName}`);
            const cfg = await res.json();
            animationMappings = cfg.mappings || {};
            chromaKeySettings = { ...chromaKeySettings, ...(cfg.chroma || {}) };
            globalPosition = cfg.globalPosition || globalPosition;
            globalScale = cfg.globalScale || globalScale;
            animationVolume = cfg.animationVolume ?? animationVolume;
            updateDebugInfo();
        } catch (e) { console.warn('failed loading config', e); }
        connectToAnimationStream();
        console.log('Animation overlay initialized');
    })();

    window.addEventListener('click', () => {
        ensureAudioContext();
        console.log("System Ready");
        // Play a tiny silent video/audio if needed to prime the engine
    }, { once: true });

</script>
</body>
</html>
