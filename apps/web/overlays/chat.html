<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unified Chat Overlay</title>
    <style>
        :root {
            --size: min(100vw, 100vh);
            --text-scale: 3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            font-family: "Trebuchet MS", "Segoe UI", "Noto Sans", sans-serif;
        }

        .overlay-shell {
            position: fixed;
            top: 50%;
            left: 50%;
            width: var(--size);
            height: var(--size);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .chat-card {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 10px;
            padding: 16px;
            overflow: hidden;
        }

        .message {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            animation: riseIn 180ms ease;
        }

        .line {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            min-width: 0;
            white-space: nowrap;
        }

        .avatar {
            width: calc(14px * var(--text-scale));
            height: calc(14px * var(--text-scale));
            border-radius: 999px;
            flex: none;
            object-fit: cover;
            background: #334155;
        }

        .avatar.placeholder {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: calc(0.5rem * var(--text-scale));
            font-weight: 700;
            color: #f8fafc;
            text-transform: uppercase;
        }

        .platform-icon {
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: calc(7px * var(--text-scale));
            height: calc(7px * var(--text-scale));
            border-radius: 6px;
            font-size: calc(0.35rem * var(--text-scale));
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.03em;
            color: #0f172a;
            background: #f43f5e;
        }

        .platform-icon.tiktok {
            background: #00f2ea;
        }

        .name {
            flex: none;
            max-width: 38%;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: calc(0.62rem * var(--text-scale));
            font-weight: 700;
            color: #94a3b8;
        }

        .text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: calc(0.66rem * var(--text-scale));
            line-height: 1.1;
            color: #ffffff;
        }

        .empty {
            margin: auto 0;
            color: #94a3b8;
            text-align: center;
            font-size: calc(0.6rem * var(--text-scale));
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="overlay-shell">
    <div class="chat-card">
        <div id="messages" class="messages">
            <div class="empty">Waiting for chat messages...</div>
        </div>
    </div>
</div>

<script>
    const MAX_MESSAGES = (() => {
        const raw = Number(new URLSearchParams(window.location.search).get('limit'));
        if (!Number.isFinite(raw)) return 14;
        return Math.max(4, Math.min(30, Math.floor(raw)));
    })();

    const messagesEl = document.getElementById('messages');
    const messages = [];

    function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = String(value ?? '');
        return div.innerHTML;
    }

    function render() {
        if (messages.length === 0) {
            messagesEl.innerHTML = '<div class="empty">Waiting for chat messages...</div>';
            return;
        }

        messagesEl.innerHTML = messages.map((msg) => {
            const displayName = msg.displayName || msg.author || 'viewer';
            const initials = String(displayName).trim().charAt(0) || '?';
            const platform = String(msg.platform || '').toLowerCase() === 'tiktok' ? 'tiktok' : 'youtube';
            const platformLabel = platform === 'tiktok' ? 'TT' : 'YT';
            const avatarHtml = msg.avatar
                ? `<img class="avatar" src="${escapeHtml(msg.avatar)}" alt="${escapeHtml(displayName)}">`
                : `<span class="avatar placeholder">${escapeHtml(initials)}</span>`;

            return `
                <div class="message">
                    <div class="line">
                        ${avatarHtml}
                        <span class="platform-icon ${platform}" title="${platform === 'tiktok' ? 'TikTok' : 'YouTube'}">${platformLabel}</span>
                        <span class="name" title="${escapeHtml(msg.author || displayName)}">${escapeHtml(displayName)}</span>
                        <span class="text">${escapeHtml(msg.text || '')}</span>
                    </div>
                </div>
            `;
        }).join('');
    }

    function pushMessage(message) {
        if (!message || !message.text) return;
        messages.push({
            platform: String(message.platform || '').trim().toLowerCase(),
            author: String(message.author || '').trim(),
            displayName: String(message.displayName || message.author || '').trim(),
            avatar: typeof message.avatar === 'string' && message.avatar.trim() ? message.avatar.trim() : null,
            text: String(message.text || '').trim()
        });
        while (messages.length > MAX_MESSAGES) messages.shift();
        render();
    }

    const eventSource = new EventSource('/overlay/chat/stream');
    eventSource.onmessage = (event) => {
        try {
            const payload = JSON.parse(event.data);
            if (payload?.type === 'snapshot' && Array.isArray(payload.messages)) {
                messages.length = 0;
                payload.messages.slice(-MAX_MESSAGES).forEach(pushMessage);
                return;
            }
            pushMessage(payload);
        } catch (err) {
            console.error('Chat overlay parse error:', err);
        }
    };
</script>
</body>
</html>
